[package]
name = "lmatrix"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fastrand = "2.5.0"
glob = "0.3.4"
humantime = "2.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = "1.2.1"
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_EventLog",
	"Win32_Storage_FileSystem",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }
